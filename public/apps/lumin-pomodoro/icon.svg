<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lumin Pomodoro app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#d9327a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- timer dial -->
  <circle cx="256" cy="268" r="132" fill="none" stroke="#fffdf7" stroke-opacity="0.35" stroke-width="22"/>
  <!-- elapsed arc: ~70% -->
  <path d="M256 136 A132 132 0 1 1 130.6 222.4" fill="none" stroke="#fffdf7" stroke-width="22" stroke-linecap="round"/>
  <!-- hand -->
  <line x1="256" y1="268" x2="256" y2="172" stroke="#fffdf7" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="268" r="16" fill="#fffdf7"/>
  <!-- stem -->
  <rect x="238" y="84" width="36" height="28" rx="10" fill="#fffdf7"/>
</svg>
