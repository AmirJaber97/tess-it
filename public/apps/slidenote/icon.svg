<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SlideNote app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#f08c42"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a3b00" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- left edge bar: the screen edge SlideNote slides from -->
  <rect x="64" y="96" width="26" height="320" rx="13" fill="#fffdf7" fill-opacity="0.55"/>
  <!-- the note panel, sliding out from the edge -->
  <g filter="url(#sh)">
    <rect x="120" y="112" width="296" height="288" rx="34" fill="#fffdf7"/>
  </g>
  <!-- text lines -->
  <rect x="160" y="168" width="180" height="22" rx="11" fill="#f08c42"/>
  <rect x="160" y="216" width="216" height="16" rx="8" fill="#e7dfce"/>
  <rect x="160" y="252" width="216" height="16" rx="8" fill="#e7dfce"/>
  <rect x="160" y="288" width="150" height="16" rx="8" fill="#e7dfce"/>
  <!-- caret -->
  <rect x="318" y="284" width="5" height="24" rx="2.5" fill="#f08c42"/>
</svg>
