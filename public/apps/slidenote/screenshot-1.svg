<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="SlideNote with the All Notes switcher open, in its cream theme">
  <defs>
    <linearGradient id="wall1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#3d2740"/>
    </linearGradient>
    <filter id="win1-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="14" dy="10" stdDeviation="30" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="menu1-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#3a2a10" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- brand wallpaper (replaces the real calendar) -->
  <rect width="1280" height="800" fill="url(#wall1)"/>

  <!-- SlideNote window (cream theme), slid in from the left -->
  <g filter="url(#win1-sh)" font-family="-apple-system, Segoe UI, sans-serif">
    <rect x="44" y="60" width="712" height="680" rx="22" fill="#f4ecd9"/>

    <!-- title bar -->
    <text x="76" y="108" font-size="18" font-weight="700" fill="#2b2722">Untitled</text>
    <!-- toolbar icon group, top-right -->
    <g transform="translate(556 86)" fill="none" stroke="#8a8170" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="172" height="34" rx="9" fill="#ece2c8" stroke="none"/>
      <!-- compose -->
      <path d="M14 22l-3 1 1-3 9-9 2 2-9 9z"/>
      <!-- pin -->
      <path d="M52 6l8 8-4 1-3 6-2-2-5 5 5-5-2-2 6-3 1-4z"/>
      <!-- plus -->
      <path d="M84 9v12M78 15h12"/>
      <!-- list (active) -->
      <rect x="106" y="3" width="34" height="28" rx="7" fill="#f0a93b" stroke="none"/>
      <g stroke="#5a3a00"><path d="M116 11h16M116 16h16M116 21h16"/></g>
      <!-- trash -->
      <path d="M150 10h14M153 10l1-2h6l1 2M152 10v13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V10"/>
    </g>

    <!-- note tab strip -->
    <g font-size="11.5" fill="#6f6857">
      <rect x="72" y="128" width="64" height="22" rx="11" fill="#ece2c8"/>
      <text x="104" y="143" text-anchor="middle">important</text>
      <rect x="142" y="128" width="60" height="22" rx="11" fill="#f7e6bd"/>
      <text x="172" y="143" text-anchor="middle" fill="#7a5a18" font-weight="600">Untitled</text>
      <rect x="208" y="128" width="128" height="22" rx="11" fill="#ece2c8"/>
      <text x="272" y="143" text-anchor="middle">community app idea 2</text>
      <rect x="342" y="128" width="52" height="22" rx="11" fill="#ece2c8"/>
      <text x="368" y="143" text-anchor="middle">TOOLZ</text>
      <rect x="400" y="128" width="58" height="22" rx="11" fill="#ece2c8"/>
      <text x="429" y="143" text-anchor="middle">linkedin</text>
      <rect x="464" y="128" width="128" height="22" rx="11" fill="#ece2c8"/>
      <text x="528" y="143" text-anchor="middle">community app idea 1</text>
      <rect x="598" y="128" width="34" height="22" rx="11" fill="#ece2c8"/>
      <text x="615" y="143" text-anchor="middle">cg</text>
      <rect x="638" y="128" width="44" height="22" rx="11" fill="#ece2c8"/>
      <text x="660" y="143" text-anchor="middle">bugs</text>
    </g>

    <!-- formatting toolbar -->
    <g font-size="13" fill="#5f5848">
      <text x="76" y="180" font-weight="800" fill="#2b2722">B</text>
      <text x="96" y="180" font-style="italic">I</text>
      <text x="112" y="180" text-decoration="underline">U</text>
      <line x1="130" y1="170" x2="130" y2="182" stroke="#d8ccae"/>
      <text x="142" y="180">A</text>
      <text x="166" y="180" font-family="monospace" font-size="12">14pt</text>
      <text x="206" y="181" font-size="15">A</text>
      <text x="226" y="180" font-size="14">↺</text>
      <circle cx="724" cy="175" r="9" fill="none" stroke="#b9ad90"/>
      <text x="724" y="180" text-anchor="middle" font-size="12" fill="#b9ad90" font-style="italic">i</text>
    </g>

    <!-- note body (left of the menu) -->
    <g font-size="14" fill="#4a4536">
      <text x="76" y="224">Ship the SlideNote landing page</text>
      <text x="76" y="250">— wire up the App Store badge</text>
      <text x="76" y="276">— swap in real screenshots</text>
      <rect x="76" y="296" width="3" height="18" fill="#f0a93b"/>
    </g>
  </g>

  <!-- "All notes" dropdown, anchored under the list icon -->
  <g filter="url(#menu1-sh)" font-family="-apple-system, Segoe UI, sans-serif">
    <rect x="556" y="178" width="300" height="436" rx="14" fill="#fffdf7"/>
    <text x="578" y="208" font-size="13" font-weight="700" fill="#2b2722">All notes</text>

    <!-- search field -->
    <rect x="576" y="220" width="260" height="34" rx="9" fill="#f6efdd" stroke="#f0a93b" stroke-width="1.5"/>
    <circle cx="594" cy="237" r="5.5" fill="none" stroke="#9a907a" stroke-width="1.5"/>
    <line x1="598" y1="241" x2="602" y2="245" stroke="#9a907a" stroke-width="1.5" stroke-linecap="round"/>
    <text x="612" y="241" font-size="12.5" fill="#9a907a">Search title…</text>

    <!-- rows: title + relative time -->
    <g font-size="13">
      <text x="592" y="288" fill="#3a3528">important</text>
      <text x="836" y="288" text-anchor="end" font-size="11" fill="#a39a85">4 mths</text>

      <rect x="568" y="298" width="276" height="26" rx="7" fill="#f7e6bd"/>
      <text x="592" y="316" fill="#6a4c14" font-weight="600">Untitled</text>
      <text x="836" y="316" text-anchor="end" font-size="11" fill="#b08a3c">1 hr</text>

      <text x="592" y="344" fill="#3a3528">community app idea 2</text>
      <text x="836" y="344" text-anchor="end" font-size="11" fill="#a39a85">5 mths</text>

      <text x="592" y="372" fill="#3a3528">TOOLZ</text>
      <text x="836" y="372" text-anchor="end" font-size="11" fill="#a39a85">4 mths</text>

      <text x="592" y="400" fill="#3a3528">linkedin</text>
      <text x="836" y="400" text-anchor="end" font-size="11" fill="#a39a85">8 mths</text>

      <text x="592" y="428" fill="#3a3528">community app idea 1</text>
      <text x="836" y="428" text-anchor="end" font-size="11" fill="#a39a85">9 mths</text>

      <text x="592" y="456" fill="#3a3528">cg</text>
      <text x="836" y="456" text-anchor="end" font-size="11" fill="#a39a85">4 mths</text>

      <text x="592" y="484" fill="#3a3528">bugs</text>
      <text x="836" y="484" text-anchor="end" font-size="11" fill="#a39a85">1 mth</text>

      <text x="592" y="512" fill="#3a3528">anime</text>
      <text x="836" y="512" text-anchor="end" font-size="11" fill="#a39a85">2 mths</text>

      <text x="592" y="540" fill="#3a3528">Week planning</text>
      <text x="836" y="540" text-anchor="end" font-size="11" fill="#a39a85">2 mths</text>

      <text x="592" y="568" fill="#3a3528">community app idea 3</text>
      <text x="836" y="568" text-anchor="end" font-size="11" fill="#a39a85">9 mths</text>
    </g>
  </g>
</svg>
