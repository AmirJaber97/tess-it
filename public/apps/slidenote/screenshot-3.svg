<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="A SlideNote note with rich text formatting">
  <defs>
    <linearGradient id="wall3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#3d2740"/>
    </linearGradient>
    <filter id="win-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="34" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#wall3)"/>

  <!-- centered note window -->
  <g filter="url(#win-sh)">
    <rect x="300" y="120" width="680" height="560" rx="22" fill="#fbf5ea"/>
  </g>
  <!-- title bar with formatting toolbar -->
  <rect x="300" y="120" width="680" height="52" rx="22" fill="#f3ecdc"/>
  <rect x="300" y="150" width="680" height="22" fill="#f3ecdc"/>
  <circle cx="328" cy="146" r="6" fill="#ff6b5d"/>
  <circle cx="350" cy="146" r="6" fill="#ffc14d"/>
  <circle cx="372" cy="146" r="6" fill="#2cc9b5"/>
  <g font-family="sans-serif" font-size="15" fill="#6e675c">
    <text x="430" y="151" font-weight="800" fill="#221f1a">B</text>
    <text x="462" y="151" font-style="italic">I</text>
    <text x="490" y="151" text-decoration="underline">U</text>
    <text x="528" y="151" font-family="monospace">H1</text>
    <text x="568" y="151" font-family="monospace">•</text>
    <text x="598" y="151" font-family="monospace">1.</text>
    <text x="636" y="151" font-family="monospace">‹/›</text>
  </g>

  <!-- formatted content -->
  <text x="340" y="232" font-family="sans-serif" font-size="30" font-weight="800" fill="#221f1a">Launch checklist</text>
  <text x="340" y="280" font-family="sans-serif" font-size="16" fill="#4f4a40">A few things to lock down before <tspan font-weight="700" fill="#221f1a">submission day</tspan>:</text>

  <g font-family="sans-serif" font-size="16" fill="#4f4a40">
    <circle cx="348" cy="322" r="4" fill="#f08c42"/>
    <text x="368" y="328">Final pass on the marketing copy</text>
    <circle cx="348" cy="360" r="4" fill="#f08c42"/>
    <text x="368" y="366">Screenshots at every required size</text>
    <circle cx="348" cy="398" r="4" fill="#f08c42"/>
    <text x="368" y="404">Support &amp; privacy URLs live</text>
  </g>

  <text x="340" y="470" font-family="sans-serif" font-size="20" font-weight="700" fill="#221f1a">Notes</text>
  <text x="340" y="506" font-family="sans-serif" font-size="16" fill="#4f4a40">Keep the description’s opening line punchy —</text>
  <text x="340" y="532" font-family="sans-serif" font-size="16" fill="#4f4a40">it doubles as the site’s pitch.</text>

  <rect x="340" y="560" width="600" height="60" rx="10" fill="#f3ecdc"/>
  <text x="356" y="588" font-family="monospace" font-size="13" fill="#6e675c">defaults write net.tess-it.SlideNote edgeTrigger -bool true</text>
  <text x="356" y="608" font-family="monospace" font-size="13" fill="#9a8f7a"># opt back into the edge trigger</text>
</svg>
